function renderMultiLine(containerId, cycles, seriesObj, colorMap, opts) {
  opts = opts || {};
  const width = 900, height = 320, padL = 56, padR = 20, padT = 16, padB = 34;
  const plotW = width - padL - padR, plotH = height - padT - padB;
  const container = document.getElementById(containerId);
  const keys = Object.keys(seriesObj);
  const logScale = !!opts.log;

  let allVals = [];
  keys.forEach(k => seriesObj[k].forEach(v => { if (v !== null && v > 0) allVals.push(v); else if (v !== null && !logScale) allVals.push(v); }));
  let vMin = Math.min(...allVals), vMax = Math.max(...allVals);
  if (logScale) { vMin = Math.max(vMin, 1e-12); }
  if (!logScale) { const pad = (vMax - vMin) * 0.08 || 1; vMin -= pad; vMax += pad; }

  function yScale(v) {
    if (v === null) return null;
    if (logScale) {
      if (v <= 0) return null;
      const lo = Math.log10(vMin), hi = Math.log10(vMax);
      return padT + plotH - ((Math.log10(v) - lo) / (hi - lo)) * plotH;
    }
    return padT + plotH - ((v - vMin) / (vMax - vMin)) * plotH;
  }
  function xScale(i) { return padL + (i / (cycles.length - 1)) * plotW; }

  let svg = `<svg viewBox="0 0 ${width} ${height}" width="100%" style="max-width:${width}px">`;
  // gridlines (5 horizontal)
  for (let g = 0; g <= 4; g++) {
    const y = padT + (g / 4) * plotH;
    svg += `<line class="gridline" x1="${padL}" y1="${y}" x2="${width - padR}" y2="${y}"/>`;
    let val;
    if (logScale) { val = Math.pow(10, Math.log10(vMin) + (1 - g / 4) * (Math.log10(vMax) - Math.log10(vMin))); }
    else { val = vMin + (1 - g / 4) * (vMax - vMin); }
    const label = Math.abs(val) >= 1000 ? val.toFixed(0) : (Math.abs(val) >= 1 ? val.toFixed(2) : val.toPrecision(2));
    svg += `<text class="axis" x="${padL - 8}" y="${y + 3}" text-anchor="end">${label}</text>`;
  }
  // x axis ticks
  const step = Math.max(1, Math.round(cycles.length / 10));
  for (let i = 0; i < cycles.length; i += step) {
    svg += `<text class="axis" x="${xScale(i)}" y="${height - padB + 16}" text-anchor="middle">${cycles[i]}</text>`;
  }
  svg += `<text class="axis-title" x="${width/2}" y="${height - 4}" text-anchor="middle">cycle</text>`;

  keys.forEach((k, si) => {
    const vals = seriesObj[k];
    let path = "", started = false;
    for (let i = 0; i < vals.length; i++) {
      const y = yScale(vals[i]);
      if (y === null) { started = false; continue; }
      const x = xScale(i);
      path += (started ? "L" : "M") + x.toFixed(1) + "," + y.toFixed(1) + " ";
      started = true;
    }
    svg += `<path d="${path}" fill="none" stroke="${colorMap[k]}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
  });

  svg += `<g id="${containerId}-crosshair" style="display:none"><line class="crosshair" x1="0" y1="${padT}" x2="0" y2="${padT+plotH}"/></g>`;
  svg += `<rect id="${containerId}-hover" x="${padL}" y="${padT}" width="${plotW}" height="${plotH}" fill="transparent"/>`;
  svg += `</svg>`;

  let legend = `<div class="legend">`;
  keys.forEach(k => { legend += `<span class="legend-item"><span class="legend-swatch" style="background:${colorMap[k]}"></span>${k}</span>`; });
  legend += `</div>`;

  container.innerHTML = svg + legend;

  const svgEl = container.querySelector("svg");
  const hoverRect = document.getElementById(containerId + "-hover");
  const crosshair = document.getElementById(containerId + "-crosshair");
  const tooltip = document.getElementById("tooltip");

  hoverRect.addEventListener("mousemove", (e) => {
    const rect = svgEl.getBoundingClientRect();
    const scaleX = width / rect.width;
    const mx = (e.clientX - rect.left) * scaleX;
    let idx = Math.round(((mx - padL) / plotW) * (cycles.length - 1));
    idx = Math.max(0, Math.min(cycles.length - 1, idx));
    const x = xScale(idx);
    crosshair.style.display = "block";
    crosshair.querySelector("line").setAttribute("x1", x);
    crosshair.querySelector("line").setAttribute("x2", x);
    let html = `<div class="cyc">cycle ${cycles[idx]}</div>`;
    keys.forEach(k => {
      const v = seriesObj[k][idx];
      const vs = v === null ? "—" : (Math.abs(v) >= 1000 ? v.toLocaleString(undefined,{maximumFractionDigits:0}) : v.toPrecision(4));
      html += `<div class="row"><span style="color:${colorMap[k]}">${k}</span><span>${vs}</span></div>`;
    });
    tooltip.innerHTML = html;
    tooltip.style.display = "block";
    tooltip.style.left = (e.clientX + 14) + "px";
    tooltip.style.top = (e.clientY + 10) + "px";
  });
  hoverRect.addEventListener("mouseleave", () => { crosshair.style.display = "none"; tooltip.style.display = "none"; });
}

function renderSmallMultiples(containerId, cycles, pctSeries, agentOrder) {
  const container = document.getElementById(containerId);
  let allPct = [];
  agentOrder.forEach(a => pctSeries[a].forEach(v => allPct.push(v)));
  const vMax = Math.max(...allPct.map(Math.abs)) * 1.1 || 1;
  const w = 160, h = 90, padT = 6, padB = 16, padL = 4, padR = 4;
  const plotW = w - padL - padR, plotH = h - padT - padB;

  let html = `<div class="small-multiples">`;
  agentOrder.forEach((agent, ai) => {
    const vals = pctSeries[agent];
    const color = "#2a78d6";
    function y(v) { return padT + plotH - ((v + vMax) / (2 * vMax)) * plotH; }
    function x(i) { return padL + (i / (cycles.length - 1)) * plotW; }
    let path = "";
    for (let i = 0; i < vals.length; i++) { path += (i === 0 ? "M" : "L") + x(i).toFixed(1) + "," + y(vals[i]).toFixed(1) + " "; }
    const zeroY = y(0);
    const last = vals[vals.length - 1];
    const lastColor = last >= 0 ? "#0ca30c" : "#d03b3b";
    html += `<div class="panel">
      <div class="panel-title">${agent}</div>
      <div class="panel-value" style="color:${lastColor}">${last >= 0 ? "+" : ""}${last.toFixed(1)}%</div>
      <svg viewBox="0 0 ${w} ${h}" width="100%">
        <line class="zero-line" x1="${padL}" y1="${zeroY}" x2="${w-padR}" y2="${zeroY}"/>
        <path d="${path}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </div>`;
  });
  html += `</div>`;
  container.innerHTML = html;
}
